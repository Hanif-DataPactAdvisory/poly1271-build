name: Build Exact POLY1271 Reference

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clone exact Polymarket SDK
        shell: pwsh
        run: |
          git clone https://github.com/Polymarket/rs-clob-client-v2.git sdk
          cd sdk
          git checkout 222143d321eba97d5711a848265eb9aab3bc7ff4
          git rev-parse HEAD

      - name: Build Poly1271 example
        shell: pwsh
        run: |
          cd sdk
          cargo build --release --features clob --example gtc_limit_buy_deposit_wallet

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: poly1271-reference-222143d
          path: sdk/target/release/examples/gtc_limit_buy_deposit_wallet.exe
